<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Reckoning — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfd;
        --fg: #1d1d20;
        --muted: #6b6b76;
        --line: #e3e3e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131316;
          --fg: #f2f2f5;
          --muted: #9a9aa6;
          --line: #2a2a31;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 30rem;
        width: 100%;
        text-align: center;
      }
      .mark {
        width: 2.75rem;
        height: 2.75rem;
        margin: 0 auto 1.75rem;
        border: 2px solid var(--fg);
        border-radius: 0.6rem;
        display: grid;
        place-items: center;
        font-weight: 650;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: 1.4rem;
        font-weight: 620;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
        text-wrap: pretty;
      }
      footer {
        margin-top: 2.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">R</div>
      <h1>This environment is offline</h1>
      <p>
        Nothing is running here right now. It will come back when the environment
        is next started — no action is needed on your side.
      </p>
      <footer>Reckoning</footer>
    </main>
  </body>
</html>
